<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CP 서사 생성기</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --panel2:#f2f2f4; --border:#e2e2e6;
  --text:#1b1b1f; --sub:#6f6f78; --accent:#6e6ef0; --accent2:#b0578a;
  --ok:#2e9e63; --bad:#c9483e;
}
*{box-sizing:border-box;}
html{touch-action:manipulation;}
input{font-size:16px;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Segoe UI',sans-serif;}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:420px;}
.card.wide{max-width:720px;}
h1{font-size:22px;font-weight:600;text-align:center;margin:0 0 6px;letter-spacing:-0.02em;}
.sub{color:var(--sub);font-size:13px;text-align:center;margin:0 0 28px;}
label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;}
input{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s;}
input:focus{border-color:var(--accent);}
.hint{font-size:11px;color:var(--sub);margin-top:8px;line-height:1.6;}
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}
.err{background:rgba(217,115,107,.08);border:1px solid rgba(217,115,107,.25);color:var(--bad);padding:10px 12px;border-radius:8px;font-size:13px;margin-top:14px;}
button.primary{width:100%;padding:12px;margin-top:22px;background:var(--text);color:var(--bg);border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;}
button.primary:hover{opacity:.85;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0;}
@media(max-width:640px){.grid2{grid-template-columns:1fr;}}
.person{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:20px;}
.person h3{font-size:14px;font-weight:600;color:var(--accent2);margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.person .field{margin-bottom:12px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.row3 input{text-align:center;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent2);animation:pulse 1.2s infinite ease-in-out;}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.9);}50%{opacity:1;transform:scale(1.1);}}
.loading h2{font-size:16px;font-weight:600;margin:20px 0 4px;}
.loading p{color:var(--sub);font-size:13px;margin:0;}
.trivia{margin-top:28px;max-width:320px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:12px;color:var(--sub);line-height:1.6;}
.result-wrap{max-width:680px;margin:0 auto;padding:48px 20px;}
.result-title{text-align:center;margin-bottom:36px;}
.result-title h1{font-size:26px;}
.result-title p{color:var(--sub);font-size:13px;margin-top:6px;}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
@media(max-width:640px){.profiles{grid-template-columns:1fr;}}
.profile{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;}
.profile h3{font-size:15px;margin:0 0 10px;color:var(--text);}
.profile p{font-size:13px;color:var(--sub);line-height:1.8;margin:0;white-space:pre-line;}
.cc-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px;}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media(max-width:640px){.cc-grid{grid-template-columns:1fr;}}
.cc-grid h4{font-size:13px;font-weight:600;margin:0 0 12px;}
.cc-grid h4.ok{color:var(--ok);}
.cc-grid h4.bad{color:var(--bad);}
.cc-grid ul{list-style:none;margin:0;padding:0;}
.cc-grid li{font-size:13px;color:var(--sub);margin-bottom:8px;padding-left:16px;position:relative;}
.cc-grid li:before{position:absolute;left:0;}
.cc-grid li.ok:before{content:"✓";color:var(--ok);}
.cc-grid li.bad:before{content:"·";color:var(--bad);}
.story-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:32px 24px;text-align:center;}
.story-box p{font-size:15px;line-height:1.9;color:var(--text);font-style:italic;margin:0;}
.retry{display:flex;justify-content:center;margin-top:32px;}
.retry button{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 24px;border-radius:100px;font-size:13px;cursor:pointer;}
.retry button:hover{background:var(--border);}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

const {useState, useEffect} = React;

const fetchSajuData = async (person, geminiKey) => {
  const response = await fetch('https://saju-api-s6x0.onrender.com/saju', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      year: person.year,
      month: person.month,
      day: person.day,
      hour: person.hourUnknown ? null : (parseInt(person.hour) || 0),
      minute: parseInt(person.minute) || 0,
      gender: person.gender,
      calendar: person.calendar,
      geminiKey: geminiKey,
      question: `${person.name}의 사주를 분석해줘.`
    })
  });

  if (!response.ok) {
    const text = await response.text();
    console.log("SAJU ERROR:", text);
    if (response.status === 429) {
      throw new Error('사주 서버 요청이 몰려 있어요. 잠시 후 다시 시도해주세요.');
    }
    throw new Error(text);
  }
  const data = await response.json();
  if (!data.success) throw new Error('사주 계산에 실패했습니다.');
  return data.result;
};

function App(){
  const [step, setStep] = useState('setup');
  const [apiKey, setApiKey] = useState('');
  const [error, setError] = useState('');
  const [personA, setPersonA] = useState({ name:'나', year:1995, month:5, day:15, hour:'', hourUnknown:false, minute:0, gender:'male', calendar:'solar' });
  const [personB, setPersonB] = useState({ name:'최애', year:1994, month:9, day:12, hour:'', hourUnknown:false, minute:0, gender:'female', calendar:'solar' });
  const [resultData, setResultData] = useState(null);
  const [triviaIdx, setTriviaIdx] = useState(0);

  useEffect(() => {
    if (step !== 'loading') return;
    setTriviaIdx(Math.floor(Math.random() * TRIVIA.length));
    const t = setInterval(() => {
      setTriviaIdx(Math.floor(Math.random() * TRIVIA.length));
    }, 5000);
    return () => clearInterval(t);
  }, [step]);

  const handleStartSetup = (e) => {
    e.preventDefault();
    if (!apiKey.trim() || apiKey.length < 20) {
      setError('유효한 Gemini API 키를 입력해주세요.');
      return;
    }
    setError('');
    setStep('input');
  };

  const generateCPStory = async () => {
    setStep('loading');
    setError('');
    let sajuData;
    try {
      const sajuA = await fetchSajuData(personA, apiKey);
      const sajuB = await fetchSajuData(personB, apiKey);
      sajuData = { personA: sajuA, personB: sajuB };
    } catch (err) {
      console.error(err);
      setError(err.message || '사주 데이터를 가져오는 중 오류가 발생했습니다.');
      setStep('input');
      return;
    }

    const tropes = ["혐관에서 찐사랑","소꿉친구에서 연인","햇살캐와 츤데레","계략공과 눈치제로수","운명적인 첫눈에 반함","티격태격 배틀호모","쌍방구원 서사"];
    const randomTrope = tropes[Math.floor(Math.random() * tropes.length)];

    const systemPrompt = `당신은 실제로 사주를 오래 봐온 사람처럼 말하는 사주 해설가이자, 동시에 그 사주를 소재로 웹소설 세계관을 창작하는 작가입니다.
    말투는 "은근 이런 타입입니다", "생각보다 고집이 꽤 있는 편이에요", "이 부분은 좀 인정해야 합니다"처럼 친근하고 팩폭 섞인 구어체를 씁니다. 딱딱한 설명체나 AI스러운 문장은 금지합니다.
    개인 사주 해설은 일간/월지/일지/오행의 강약과 과부족 기운을 실제로 짚어가며, 그 사람만의 개성이 느껴지도록 구체적으로 씁니다.
    궁합은 좋은 말만 하지 말고 장점과 단점을 솔직하게, 직설적으로 씁니다.
    세계관과 역할은 반드시 각 인물의 실제 오행 강약 분석 결과를 근거로 선택합니다(예: 리더십형→지휘관·황제·길드장, 분석형→연구원·해커·의사, 자유분방형→용병·정보상·여행가, 정의감형→형사·기사·경찰, 표현형→배우·아이돌·화가). 단순 랜덤 조합처럼 보이지 않게, 사용자가 "내 사주라서 이 역할이 나왔구나"를 느끼도록 합니다. storySetting 문장 안에는 A와 B의 이름을 각 역할과 함께 명시해 누가 어떤 역할인지 명확히 드러냅니다.
    세계관은 특수 세계관(판타지, 헌터, 사이버펑크, 디스토피아, SF, 무협, 오메가버스, 궁정 등)과 현실적 배경(대학, 오피스, 동네 일상, 연예계, 스포츠, 의료, 자영업, 예술, 공무원, 서비스업 등)을 절반씩 비슷한 비중으로 다양하게 사용합니다. 매번 전혀 다른 분위기가 나오도록 하되 반복은 피합니다.
    아래 [사주 API 결과] JSON에는 이미 계산된 사주 데이터(사주 원국, 오행, 대운, 십신 강약 등)가 모두 들어 있습니다. 당신은 오행이나 사주를 직접 계산하거나 추측하지 말고, 반드시 이 JSON 데이터에 나온 값만 근거로 해석하세요. JSON에 없는 정보는 지어내지 마세요.
    compatibilityScore(0~100)는 JSON에 포함된 오행/십신 데이터를 근거로 당신이 직접 산출하되, 그 근거를 scoreReason에 반드시 명시하세요.
    storySetting은 문장이 아니라 웹소설 소개 태그처럼 짧고 강하게 끊어서 씁니다("~입니다","~서사입니다" 같은 서술형 종결 금지, 예: "디스토피아 세계의 조직원과 의사, 생존기").
    프롤로그는 설정 설명이 아니라 이미 이야기가 한창 진행 중인 하이라이트 장면(대치, 고백 직전, 구출, 첫 키스 직전, 진실 폭로 등) 하나를 대사와 행동, 긴장감 중심으로 생생하게 씁니다.
    매우 중요: 모든 결과 텍스트(lineA, lineB, relationLine, scoreReason, storySetting, prologue 포함)에서 "그", "그녀", "남성", "여성", "남자", "여자" 등 성별을 특정하는 표현을 절대 사용하지 마세요. 대신 "상대", "이 사람", "두 사람", "서로", "한쪽", "다른 한쪽" 같은 성별 중립 표현만 사용하세요. 인물을 지칭할 때는 이름(캐릭터 A/B의 이름)을 반복 사용하거나 중립 표현을 쓰세요.
    결과는 반드시 제공된 JSON 스키마에 맞게 출력해야 합니다.`;

    const userPrompt = `
      아래는 사주 API 결과입니다.
      캐릭터 A 이름: ${personA.name}
      캐릭터 B 이름: ${personB.name}
      ${JSON.stringify(sajuData)}
      위 데이터만 근거로 해석하세요. 오행이나 사주를 다시 계산하거나 추측하지 마세요.

      다음을 작성해주세요 (성별을 특정하는 표현 없이, "상대/이 사람/두 사람/서로/한쪽/다른 한쪽" 또는 이름으로만 지칭):
      1. lineA: A(personA)의 사주 풀이 3~4문장. JSON의 personA 데이터(오행, 십신 강약 등)에 나온 강약과 과부족 기운을 실제 성향으로 풀어 사주 용어(일간/월지/일지 느낌)를 자연스럽게 섞어 친근한 구어체로. 기계적 설명 금지, 팩폭 톤 포함.
      2. lineB: B(personB)도 같은 방식으로 JSON의 personB 데이터를 근거로 3~4문장.
      3. relationLine: JSON에 담긴 두 사람의 오행 데이터를 비교해 궁합을 직설적이고 솔직하게 2~3문장. 장점과 단점 모두 언급. "와 맞는데?" 싶게 구체적으로.
      4. compatibilityScore: JSON 데이터를 근거로 직접 산출한 0~100 사이의 궁합 점수.
      5. scoreReason: compatibilityScore가 나온 이유를 JSON에 나온 오행 상생/상극 관점에서 1~2문장으로 설명.
      5-1. storySetting: 먼저 JSON에 나온 A, B 각각의 오행/성향 데이터를 반영해 역할을 정하세요(리더십형→지휘관·황제·길드장, 분석형→연구원·해커·의사, 자유분방형→용병·정보상·여행가, 정의감형→형사·기사·경찰, 표현형→배우·아이돌·화가 등). 세계관은 특수 세계관과 현실적 배경(대학,오피스,동네일상,연예계,스포츠,의료,자영업,예술,공무원,서비스업 등)을 절반씩 균형 있게 다양하게 선택하세요. "${personA.name}(A의 역할)"과 "${personB.name}(B의 역할)"이 문장 안에서 각각 누구인지 명확히 드러나도록 웹소설 소개 태그 형태로 작성하세요(예: "대학 캠퍼스, 사진학과 학생 ${personA.name}과 모델 ${personB.name}의 첫사랑" 또는 "사이버펑크 도시, 무허가 해커 ${personA.name}과 치안 유지국 수사관 ${personB.name}의 추격전"). 서술형 종결("~입니다") 금지, 짧고 임팩트 있게. 분위기 참고: '${randomTrope}'. 성별 특정 표현 금지.
      6. prologue: storySetting 그대로 반영, 약 600자, 설명 없이 이야기가 한창 진행 중인 하이라이트 장면 하나(대사/행동/긴장감 중심)로. 성별 특정 표현(그/그녀/남자/여자 등) 금지, 이름으로만 지칭.
    `;

    const payload = {
      contents: [{ role:"user", parts:[{ text:userPrompt }] }],
      systemInstruction: { parts:[{ text:systemPrompt }] },
      generationConfig: {
        responseMimeType: "application/json",
        responseSchema: {
          type:"OBJECT",
          properties:{
            lineA:{ type:"STRING" },
            lineB:{ type:"STRING" },
            relationLine:{ type:"STRING" },
            compatibilityScore:{ type:"NUMBER" },
            scoreReason:{ type:"STRING" },
            storySetting:{ type:"STRING" },
            prologue:{ type:"STRING" }
          },
          required:["lineA","lineB","relationLine","compatibilityScore","scoreReason","storySetting","prologue"]
        }
      }
    };

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error('API 호출에 실패했습니다. 키가 유효한지, 무료 한도를 초과하지 않았는지 확인해주세요.');
      const result = await response.json();
      if (result.candidates && result.candidates.length > 0) {
        const jsonText = result.candidates[0].content.parts[0].text;
        const parsed = JSON.parse(jsonText);
        setResultData(parsed);
        setStep('result');
      } else {
        throw new Error('응답 데이터를 파싱할 수 없습니다.');
      }
    } catch (err) {
      console.error(err);
      setError(err.message || '서사를 생성하는 중 오류가 발생했습니다.');
      setStep('input');
    }
  };

  if (step === 'setup') {
    return (
      <div className="screen">
        <div className="card">
          <h1>CP 서사 생성기</h1>
          <p className="sub">사주 오행으로 보는 우리만의 웹소설 케미 분석</p>
          <form onSubmit={handleStartSetup}>
            <label>Google Gemini API 키</label>
            <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="AIzaSy..." />
            <p className="hint">
              입력하신 키는 브라우저 세션에만 유지되며 서버에 저장되지 않습니다.<br/>
              <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer">여기에서 무료로 발급받을 수 있어요.</a>
            </p>
            {error && <div className="err">{error}</div>}
            <button type="submit" className="primary">시작하기</button>
          </form>
        </div>
      </div>
    );
  }

  if (step === 'input') {
    return (
      <div className="screen">
        <div className="card wide">
          <h1>운명의 실타래 엮기</h1>
          <p className="sub">두 사람의 생년월일을 입력해 서사를 생성해보세요.</p>
          <div className="grid2">
            <div className="person">
              <h3>캐릭터 A (나)</h3>
              <div className="field">
                <label>이름/애칭</label>
                <input type="text" value={personA.name} onChange={e=>setPersonA({...personA, name:e.target.value})} />
              </div>
              <div className="row3">
                <div><label>년(YYYY)</label><input type="number" value={personA.year} onChange={e=>setPersonA({...personA, year:parseInt(e.target.value)||0})} /></div>
                <div><label>월(MM)</label><input type="number" min="1" max="12" value={personA.month} onChange={e=>setPersonA({...personA, month:parseInt(e.target.value)||1})} /></div>
                <div><label>일(DD)</label><input type="number" min="1" max="31" value={personA.day} onChange={e=>setPersonA({...personA, day:parseInt(e.target.value)||1})} /></div>
              </div>
              <div className="field" style={{marginTop:12}}>
                <label>생시(시간)</label>
                <input type="number" min="0" max="23" placeholder="0~23시" disabled={personA.hourUnknown} value={personA.hour} onChange={e=>setPersonA({...personA, hour:e.target.value})} />
                <label style={{marginTop:8,display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
                  <input type="checkbox" style={{width:'auto'}} checked={personA.hourUnknown} onChange={e=>setPersonA({...personA, hourUnknown:e.target.checked})} /> 생시 모름
                </label>
              </div>
              <div className="row3" style={{marginTop:12}}>
                <div><label>분(MM)</label><input type="number" min="0" max="59" value={personA.minute} onChange={e=>setPersonA({...personA, minute:parseInt(e.target.value)||0})} /></div>
                <div><label>성별</label>
                  <select value={personA.gender} onChange={e=>setPersonA({...personA, gender:e.target.value})}>
                    <option value="male">남</option>
                    <option value="female">여</option>
                  </select>
                </div>
                <div><label>양/음력</label>
                  <select value={personA.calendar} onChange={e=>setPersonA({...personA, calendar:e.target.value})}>
                    <option value="solar">양력</option>
                    <option value="lunar">음력</option>
                  </select>
                </div>
              </div>
            </div>
            <div className="person">
              <h3>캐릭터 B (상대방)</h3>
              <div className="field">
                <label>이름/애칭</label>
                <input type="text" value={personB.name} onChange={e=>setPersonB({...personB, name:e.target.value})} />
              </div>
              <div className="row3">
                <div><label>년(YYYY)</label><input type="number" value={personB.year} onChange={e=>setPersonB({...personB, year:parseInt(e.target.value)||0})} /></div>
                <div><label>월(MM)</label><input type="number" min="1" max="12" value={personB.month} onChange={e=>setPersonB({...personB, month:parseInt(e.target.value)||1})} /></div>
                <div><label>일(DD)</label><input type="number" min="1" max="31" value={personB.day} onChange={e=>setPersonB({...personB, day:parseInt(e.target.value)||1})} /></div>
              </div>
              <div className="field" style={{marginTop:12}}>
                <label>생시(시간)</label>
                <input type="number" min="0" max="23" placeholder="0~23시" disabled={personB.hourUnknown} value={personB.hour} onChange={e=>setPersonB({...personB, hour:e.target.value})} />
                <label style={{marginTop:8,display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
                  <input type="checkbox" style={{width:'auto'}} checked={personB.hourUnknown} onChange={e=>setPersonB({...personB, hourUnknown:e.target.checked})} /> 생시 모름
                </label>
              </div>
              <div className="row3" style={{marginTop:12}}>
                <div><label>분(MM)</label><input type="number" min="0" max="59" value={personB.minute} onChange={e=>setPersonB({...personB, minute:parseInt(e.target.value)||0})} /></div>
                <div><label>성별</label>
                  <select value={personB.gender} onChange={e=>setPersonB({...personB, gender:e.target.value})}>
                    <option value="male">남</option>
                    <option value="female">여</option>
                  </select>
                </div>
                <div><label>양/음력</label>
                  <select value={personB.calendar} onChange={e=>setPersonB({...personB, calendar:e.target.value})}>
                    <option value="solar">양력</option>
                    <option value="lunar">음력</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          {error && <div className="err" style={{textAlign:'center'}}>{error}</div>}
          <button onClick={generateCPStory} className="primary">서사 생성하기 →</button>
        </div>
      </div>
    );
  }

  if (step === 'loading') {
    return (
      <div className="loading">
        <div className="dot"></div>
        <h2>생성 중...</h2>
        <p>오행의 기운을 엮어 웹소설을 집필하고 있습니다.</p>
        <div className="trivia">💡 {TRIVIA[triviaIdx]}</div>
      </div>
    );
  }

  if (step === 'result' && resultData) {
    return (
      <div className="result-wrap">
        <div className="result-title">
          <h1>우리의 CP 서사</h1>
          <p>오행으로 분석한 두 사람의 운명적 관계성</p>
        </div>
        <div className="profiles">
          <div className="profile"><h3>{personA.name}</h3><p>{resultData.lineA}</p></div>
          <div className="profile"><h3>{personB.name}</h3><p>{resultData.lineB}</p></div>
        </div>
        <div className="cc-box" style={{textAlign:'center'}}>
          <h4 style={{margin:'0 0 8px',fontSize:13,color:'var(--sub)'}}>사주 궁합</h4>
          <p style={{margin:'0 0 12px',fontSize:15,lineHeight:1.7}}>{resultData.relationLine}</p>
          <div style={{fontSize:28,fontWeight:700,color:'var(--accent2)'}}>{resultData.compatibilityScore} <span style={{fontSize:14,color:'var(--sub)',fontWeight:400}}>/ 100</span></div>
          <p style={{margin:'8px 0 0',fontSize:12,color:'var(--sub)'}}>{resultData.scoreReason}</p>
        </div>
        <div className="cc-box" style={{textAlign:'center'}}>
          <h4 style={{margin:'0 0 8px',fontSize:13,color:'var(--sub)'}}>AI 서사 설정</h4>
          <p style={{margin:0,fontSize:15}}>{resultData.storySetting}</p>
        </div>
        <div className="story-box">
          <p>{resultData.prologue}</p>
        </div>
        <div className="retry">
          <button onClick={()=>setStep('input')}>다시 생성하기</button>
        </div>
      </div>
    );
  }
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
